version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: dashboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dashboard_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dashboard_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: dashboard_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/dashboard_db?schema=public
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGIN: "*"
    ports:
      - "4000:4000"
      - "5555:5555"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dashboard_network
    volumes:
      - ./prisma:/app/prisma

networks:
  dashboard_network:
    driver: bridge

volumes:
  postgres_data:
